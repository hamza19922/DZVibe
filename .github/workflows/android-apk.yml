name: DZVibe Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply auth recovery patch
        run: python3 scripts/patch-auth.py

      - name: Remove one-time patch workflow
        run: rm -f .github/workflows/finish-auth.yml

      - name: Commit completed source patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.js .github/workflows/finish-auth.yml
          if ! git diff --cached --quiet; then
            git commit -m "Complete DZVibe password recovery flow [skip ci]"
            git push
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Expo doctor
        run: npx expo-doctor@latest

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Locate release APK
        run: |
          APK=$(find android/app/build/outputs/apk -type f -name '*release*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" DZVibe-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DZVibe-Release-APK
          path: DZVibe-release.apk
          if-no-files-found: error

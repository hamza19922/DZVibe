name: DZVibe Web Export

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  export-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Expo doctor
        run: npx expo-doctor@latest

      - name: Export Web
        run: npx expo export --platform web

      - name: Upload web bundle
        uses: actions/upload-artifact@v4
        with:
          name: DZVibe-Web
          path: dist
          if-no-files-found: error
